source = ~/.cache/wal/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
    no_fade_out = false
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

shape {
    monitor =
    size = 190, 30
    color = rgba(0, 0, 0, 1.0)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.08)
    position = 0, -12
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a %d %b')"
    color = $fg
    font_size = 13
    font_family = DepartureMono Nerd Font
    position = 0, -19
    halign = center
    valign = top
}

image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 3
    border_color = $primary
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = Ndot55
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $surfaceVariant
    font_size = 16
    font_family = DepartureMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $primary
    font_size = 14
    font_family = DepartureMono Nerd Font
    position = 0, -95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surfaceVariant
    font_color = $fg
    font_family = DepartureMono Nerd Font
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    rounding = -1
    fade_on_empty = true
    fade_timeout = 1500
    position = 0, -160
    halign = center
    valign = center
}